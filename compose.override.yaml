# Automatically used for local development. Production explicitly selects compose.yaml only.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ALLOWED_ORIGINS: ${APP_ORIGIN:-http://localhost:8787},http://127.0.0.1:8787,http://localhost:5173,http://127.0.0.1:5173
    ports: ["127.0.0.1:8000:8000"]
  migrate:
    pull_policy: never
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
  postgres:
    ports: ["127.0.0.1:15432:5432"]
  redis:
    ports: ["127.0.0.1:16379:6379"]
  node-exporter:
    # Docker Desktop's root mount does not support rslave propagation.
    volumes: !override
      - /:/host:ro
