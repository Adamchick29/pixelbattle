[project]
name = "pixel-battle-api"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "redis>=6,<8",
  "pydantic-settings>=2.8,<3",
  "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<26",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<2",
  "httpx>=0.28,<1",
  "asgi-lifespan>=2.1,<3",
  "ruff>=0.11,<1",
  "websockets>=14,<17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
